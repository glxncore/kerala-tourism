<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Thanal</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="login-page">
      <!-- LEFT SIDE -->
      <section class="hero-sectionl" id="hero">
        <div class="containerl">
          <div class="hero-gridl">
            <div class="hero-contentl">
              <h1 class="hero-titlel">
                Discover Keralam, <em>differently.</em>
              </h1>
              <p class="hero-descriptionl">
                A serene, editorial guide to the tranquil backwaters,
                cloud-kissed Western Ghats, spice-laden kitchens, and untold
                coastal sanctuaries of Keralam.
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT SIDE -->
      <section class="login-sectionl">
        <div class="login-box">
          <h2>Welcome back</h2>

          <form>
            <div class="input-group">
              <label for="email"> Email </label>

              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="input-group">
              <label for="password"> Password </label>

              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="login-options">
              <label class="remember">
                <input type="checkbox" />
                Remember me
              </label>

              <a href="#"> Forgot password? </a>
            </div>

            <button type="submit">Sign in</button>
          </form>

          <p class="signup">
            Don't have an account?

            <a href="signup.html"> Create account </a>
          </p>
        </div>
      </section>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
